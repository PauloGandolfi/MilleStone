name: milestone

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-milestone_dev}
      POSTGRES_USER: ${DB_USERNAME:-milestone_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-milestone_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - milestone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-milestone_user} -d ${DB_NAME:-milestone_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  milestone_postgres_data:
